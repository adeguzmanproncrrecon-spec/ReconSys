<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Extraction</title>

    <link rel="stylesheet" href="import.css">
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <i class="fa-solid fa-file-import"></i>
        <h1>Import Extraction</h1>
    </div>

    <!-- Main Content -->
    <div class="content">

        <!-- Left Panel -->
        <div class="left-panel">

            <div class="form-group">
                <label>Facilities</label>
                <select>
                    <option>Mary Johnston</option>
                    <option>General Hospital</option>
                    <option>City Medical Center</option>
                </select>
            </div>

            <div class="form-group">
                <label>Source File</label>
                <div class="file-group">
                    <input type="text"
                        value="C:\data\imports\hospital_data.xlsx">
                    <button class="icon-btn">
                        <i class="fa-regular fa-folder-open"></i>
                    </button>

                    <input type="file" id="fileInput" hidden>
                    <button class="browse-btn"
                        onclick="document.getElementById('fileInput').click()">
                        Browse...
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>Extraction Date</label>
                <div class="date-group">
                    <input type="date" value="2026-10-01">  
                    <i class="fa-regular fa-calendar"></i>
                </div>
            </div>

            <div class="blank-area"></div>

        </div>

        <!-- Right Panel -->
        <div class="right-panel">

            <h3>Detected Sheets</h3>

            <div class="sheet-list">

                <label><input type="checkbox" checked> CLAIMS UNIV</label>
                <label><input type="checkbox" checked> SPARKS</label>
                <label><input type="checkbox" checked> MR</label>
                <label><input type="checkbox" checked> PARD</label>
                <label><input type="checkbox" checked> TAGGED</label>
                <label><input type="checkbox" checked> UNTAGGED</label>
                <label><input type="checkbox" checked> PAYMENT DETAILS</label>
                <label><input type="checkbox"> PF NAME</label>
                <label><input type="checkbox"> TRAIL</label>
                <label><input type="checkbox" checked> ICDCODE</label>
                

            </div>

        </div>

    </div>

    <!-- Footer -->
    <div class="footer">

        <button class="validate-btn">
            <i class="fa-regular fa-circle-check"></i>
            Validate
        </button>

        <button class="import-btn">
            <i class="fa-solid fa-play"></i>
            Import
        </button>

    </div>

</div>

</body>
</html>
