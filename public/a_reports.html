<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostgreSQL Database Table</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 50px auto;
            font-family: Arial, sans-serif;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2 style="text-align: center;">Reports Table</h2>

    <table id="data-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Data rows will be injected here dynamically -->
        </tbody>
    </table>

    <script>
        // Fetch data from the Node.js backend API
        fetch('/api/data')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('table-body');
                
                // Loop through the data array and append rows to the table
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.id}</td>
                        <td>${row.name}</td>
                        <td>${row.email}</td>
                    `;
                    tableBody.appendChild(tr);
                });
            })
            .catch(error => console.error('Error fetching data:', error));
            src="database.js"
            src="server.js"
    </script>

</body>
</html>
